[ai]
required = true
providers = ["openai", "google"]
description = "HAxBRO core AI provider configuration; KAI uses its own OpenRouter key failover chain"

[[secret]]
name = "OPENROUTER_API_KEY_1"
required = true
expose = true
description = "Primary OpenRouter key for HAxBRO KAI"

[[secret]]
name = "OPENROUTER_API_KEY_2"
required = true
expose = true
description = "Secondary OpenRouter key for HAxBRO KAI failover"

[[secret]]
name = "OPENROUTER_API_KEY_3"
required = true
expose = true
description = "Tertiary OpenRouter key for HAxBRO KAI failover"

# Authentication is intentionally disabled; HAxBRO uses browser-local username identity.

[[secret]]
name = "OPENAI_API_KEY"
required = false
expose = true
description = "OpenAI API key for HAxBRO primary AI provider"

[[secret]]
name = "GOOGLE_API_KEY"
required = false
expose = true
description = "Google Gemini API key for HAxBRO secondary AI provider"

[[secret]]
name = "GROQ_API_KEY"
required = false
expose = true
description = "Optional Groq API key for Kai fallback"

[[secret]]
name = "GROQ_API_KEY_2"
required = false
expose = true
description = "Second optional Groq API key for Kai fallback"

[[secret]]
name = "GROQ_API_KEY_3"
required = false
expose = true
description = "Third optional Groq API key for Kai fallback"

[[secret]]
name = "MISTRAL_API_KEY"
required = false
expose = true
description = "Optional Mistral API key for Kai fallback"

[[secret]]
name = "CEREBRAS_API_KEY"
required = false
expose = true
description = "Optional Cerebras API key for Kai fallback"

[[secret]]
name = "OPENROUTER_API_KEY"
required = false
expose = true
description = "Final OpenRouter fallback key for the Ultimax Normal API chain"

[[secret]]
name = "GROQ_API_KEY_ULTIMAX"
required = false
expose = true
description = "Optional dedicated Groq API key for the Grook steps in the Ultimax Normal API fallback chain"

[[secret]]
name = "HF_TOKEN"
required = false
expose = true
description = "Optional Hugging Face token for Kai model fallback"

[[secret]]
name = "ART_IMAGE_API_1_KEY"
required = false
expose = true
description = "Art Generation image provider slot 1 API key"

[[secret]]
name = "ART_IMAGE_API_2_KEY"
required = false
expose = true
description = "Art Generation image provider slot 2 API key"

[[secret]]
name = "ART_IMAGE_API_3_KEY"
required = false
expose = true
description = "Art Generation image provider slot 3 API key"

[[secret]]
name = "ART_VIDEO_API_1_KEY"
required = false
expose = true
description = "Art Generation video provider slot 1 API key"

[[secret]]
name = "ART_VIDEO_API_2_KEY"
required = false
expose = true
description = "Art Generation video provider slot 2 API key"

[[secret]]
name = "ART_VIDEO_API_3_KEY"
required = false
expose = true
description = "Art Generation video provider slot 3 API key"

[[secret]]
name = "NETLIFY_OAUTH_CLIENT_ID"
required = false
expose = true
description = "Legacy Netlify OAuth Client ID; no longer used by the App Maker UI"

[[secret]]
name = "NETLIFY_OAUTH_CLIENT_SECRET"
required = false
expose = true
description = "Legacy Netlify OAuth Client Secret; no longer used by the App Maker UI"

[[secret]]
name = "SUPABASE_SERVICE_ROLE_KEY"
required = false
expose = true
description = "Supabase service-role key used only server-side for the HAxBRO knowledge bridge"

[[secret]]
name = "SUPABASE_URL"
required = false
expose = true
description = "Supabase project URL for the HAxBRO knowledge warehouse"

[[secret]]
name = "ADMIN69_PASSWORD"
required = true
expose = true
description = "Private Admin69 password for the HAxBRO owner security console; set this in Hatchable Setup and never put it in frontend code"

[[secret]]
name = "HAXBRO_INGEST_KEY"
required = true
expose = true
description = "Dedicated HAxBRO ingestion key for external research agents; never share the Supabase service-role key"