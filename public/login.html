<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>Sign in · HAxBRO AI</title><style>:root{color-scheme:dark;--bg:#121313;--panel:#191a1a;--surface:#202121;--border:#383a3a;--text:#f0f0ed;--muted:#a6a7a3;--accent:#55b9d9}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--text)}body{min-height:100svh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 50% 15%,#252727 0,transparent 40%),#121313}.card{width:min(430px,100%);padding:34px;border:1px solid var(--border);border-radius:24px;background:linear-gradient(145deg,#1b1c1c,#161717);box-shadow:0 24px 80px #0008}.brand{display:flex;align-items:center;gap:11px;font-weight:800;letter-spacing:.08em}.brand img{width:32px;height:32px}.eyebrow{margin-top:28px;color:#79a9b7;font:800 10px ui-monospace,monospace;letter-spacing:.14em}.title{margin:8px 0 8px;font-size:32px;letter-spacing:-.04em}.sub{margin:0 0 24px;color:var(--muted);line-height:1.55;font-size:14px}.field{display:grid;gap:8px}.field label{font:800 10px ui-monospace,monospace;letter-spacing:.1em;color:#aeb0ad}.field input{width:100%;height:50px;border:1px solid var(--border);border-radius:13px;background:#111212;color:var(--text);padding:0 14px;font-size:16px;outline:0}.field input:focus{border-color:var(--accent);box-shadow:0 0 0 3px #55b9d922}.code{display:flex;gap:8px}.code input{text-align:center;font-size:22px;font-weight:800;padding:0}.btn{width:100%;height:50px;margin-top:12px;border:1px solid #4d8292;border-radius:13px;background:#28586a;color:#f5f6f4;font-weight:800;cursor:pointer}.btn:disabled{opacity:.5}.alt{background:transparent;border-color:var(--border);color:var(--muted)}.msg{min-height:20px;margin:14px 0 0;color:var(--muted);font-size:13px}.msg.err{color:#f08f8f}.fine{margin-top:22px;color:#747774;font-size:11px;line-height:1.5}@media(max-width:480px){body{padding:12px}.card{padding:24px 18px;border-radius:20px}.title{font-size:28px}.code{gap:6px}}</style></head><body><main class="card"><div class="brand"><img src="/logo-symbol.svg?v=218" alt=""><span>HAxBRO AI</span></div><div class="eyebrow">PERSONAL INTELLIGENCE WORKSPACE</div><h1 class="title" id="title">Sign in to HAxBRO</h1><p class="sub" id="sub">Enter your email. We'll send a six-digit verification code. No password required.</p><div id="emailStep"><div class="field"><label for="email">EMAIL / GMAIL</label><input id="email" type="email" autocomplete="username webauthn" autocapitalize="off" spellcheck="false" placeholder="you@gmail.com" required></div><button class="btn" id="send">SEND CODE</button></div><div id="codeStep" hidden><div class="field"><label>VERIFICATION CODE</label><div class="code" id="boxes"></div></div><button class="btn" id="verify">VERIFY & ENTER</button><button class="btn alt" id="change">CHANGE EMAIL</button></div><p class="msg" id="msg" aria-live="polite"></p><div class="fine">Your account and HAxBRO workspace stay separate from other users. You can use any email address, including Gmail.</div></main><script>(function(){const A=window.hatchable?.auth;if(!A){msg('Authentication is unavailable. Refresh and try again.',true);return}const $=id=>document.getElementById(id),email=$('email'),send=$('send'),verify=$('verify'),change=$('change'),emailStep=$('emailStep'),codeStep=$('codeStep'),boxes=$('boxes'),title=$('title'),sub=$('sub');let code='';function msg(t,e){$('msg').textContent=t||'';$('msg').className='msg'+(e?' err':'')}function makeBoxes(){boxes.innerHTML='';for(let i=0;i<6;i++){const x=document.createElement('input');x.maxLength=1;x.inputMode='numeric';x.autocomplete=i===0?'one-time-code':'off';x.dataset.i=i;x.setAttribute('aria-label','Digit '+(i+1));x.addEventListener('input',()=>{x.value=x.value.replace(/\D/g,'').slice(-1);if(x.value&&i<5)boxes.children[i+1].focus();});x.addEventListener('keydown',e=>{if(e.key==='Backspace'&&!x.value&&i>0)boxes.children[i-1].focus()});x.addEventListener('paste',e=>{e.preventDefault();const v=(e.clipboardData.getData('text')||'').replace(/\D/g,'').slice(0,6);[...v].forEach((d,j)=>{if(boxes.children[i+j])boxes.children[i+j].value=d});boxes.children[Math.min(i+v.length,5)].focus()});boxes.appendChild(x)}}function getCode(){return [...boxes.children].map(x=>x.value).join('')}A.getSession().then(s=>{if(s?.user)location.replace('/app/')});send.onclick=async()=>{const v=email.value.trim();if(!v||!email.checkValidity()){msg('Enter a valid email address.',true);return}send.disabled=true;msg('Sending your code…');try{await A.startLogin({email:v});emailStep.hidden=true;codeStep.hidden=false;title.textContent='Verify your email';sub.textContent='Enter the six-digit code sent to '+v+'.';makeBoxes();boxes.children[0].focus();msg('Code sent.');}catch(e){msg(e?.message||'Could not send the code.',true)}finally{send.disabled=false}};verify.onclick=async()=>{const c=getCode();if(c.length!==6){msg('Enter all six digits.',true);return}verify.disabled=true;try{await A.verifyCode({email:email.value.trim(),code:c});location.replace('/app/')}catch(e){msg(e?.message||'Invalid or expired code.',true)}finally{verify.disabled=false}};change.onclick=()=>{codeStep.hidden=true;emailStep.hidden=false;title.textContent='Sign in to HAxBRO';sub.textContent="Enter your email. We'll send a six-digit verification code. No password required.";msg('');email.focus()};email.addEventListener('keydown',e=>{if(e.key==='Enter')send.click()});email.focus()})();</script></body></html>
