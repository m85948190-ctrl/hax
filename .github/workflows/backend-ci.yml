name: HAxBRO backend CI

on:
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - "api/**"
      - "lib/**"
      - "public/**"
      - "package.json"
      - ".github/workflows/backend-ci.yml"
  push:
    branches: [main, haxbro-github-backend-no-vercel-20261014]
    paths:
      - "backend/**"
      - "api/**"
      - "lib/**"
      - "public/**"
      - "package.json"
      - ".github/workflows/backend-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: haxbro-backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run backend contract tests
        run: node --test backend/test/*.test.js
