name: Manual deploy KAI backend to Vercel

on:
  workflow_dispatch:
    inputs:
      production:
        description: "Deploy to production (true) or create a preview deployment (false)"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read

concurrency:
  group: kai-backend-vercel-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout HAxBRO repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify backend JavaScript syntax
        run: |
          node --check api/chat.js
          node --check lib/core.js
          node --check lib/kai-knowledge.js

      - name: Validate required Vercel secrets
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          test -n "$VERCEL_TOKEN" || (echo "::error::Add the VERCEL_TOKEN GitHub Actions secret." && exit 1)
          test -n "$VERCEL_ORG_ID" || (echo "::error::Add the VERCEL_ORG_ID GitHub Actions secret." && exit 1)
          test -n "$VERCEL_PROJECT_ID" || (echo "::error::Add the VERCEL_PROJECT_ID GitHub Actions secret." && exit 1)

      - name: Link repository to the selected Vercel project
        run: |
          npx --yes vercel@latest link --yes --project "$VERCEL_PROJECT_ID" --scope "$VERCEL_ORG_ID" --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy to Vercel
        run: |
          npx --yes vercel@latest deploy --yes --token="$VERCEL_TOKEN" --scope="$VERCEL_ORG_ID" ${{ inputs.production == 'true' && '--prod' || '' }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Explain next required configuration
        if: success()
        run: |
          echo "Deployment command completed."
          echo "Ensure KAI_MODEL_API_KEY is configured in the Vercel project environment."
          echo "The Hatchable frontend must call the verified Vercel /api/chat URL; its UI hosting remains unchanged."
